name: portable battle.move_grid_navigation contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: battle-grid-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 79ea62f45fb2ea8f65d081a109431e4eb1bbdb36
          path: .contract-reference/gen1
      - name: Install ROM-free test runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check native move navigation dispatch and SDK contracts
        run: |
          luajit tests/engine/battle_grid_navigation.lua
          luajit tests/engine/battle_auxiliary.lua
          luajit tests/engine/trainer_preparation.lua
          luajit tests/engine/trainer_preparation_native.lua
          luajit tests/engine/trainer_party_scope.lua
      - name: Validate pinned native Gen1 move navigation contracts
        working-directory: .contract-reference/gen1
        run: |
          luajit tests/modkit/cases/unified_gen2_hooks.lua
          luajit tests/modkit/cases/unified_gen3_hooks.lua
      - name: Compare both engines in every SDK mode
        run: |
          mkdir -p /tmp/battle-grid-contract
          python3 tools/battle-grid-contract-check/check.py --gen1 .contract-reference/gen1 \
            --api 1 --report /tmp/battle-grid-contract/api1-native.json
          python3 tools/battle-grid-contract-check/check.py --gen1 .contract-reference/gen1 \
            --report /tmp/battle-grid-contract/api2-native.json
          python3 tools/battle-grid-contract-check/check.py --gen1 .contract-reference/gen1 \
            --format unified --report /tmp/battle-grid-contract/api2-unified.json
          python3 tools/battle-grid-contract-check/check.py --gen1 .contract-reference/gen1 \
            --api 3 --format unified --report /tmp/battle-grid-contract/api3.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: battle-grid-contract
          path: /tmp/battle-grid-contract
          if-no-files-found: ignore
