name: native map music owner contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 535a5ec088c1ae1bf4d91dd3e35a56f64cf46d91
          path: .contract-reference/gen1
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: python3 tools/music-map-owner-contract-check/check.py --gen1 .contract-reference/gen1 --report /tmp/music-map-owner.json
      - uses: actions/upload-artifact@v7
        with:
          name: music-map-owner-contract
          path: /tmp/music-map-owner.json
          if-no-files-found: error
