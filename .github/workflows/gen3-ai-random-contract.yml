name: native GBA AI random branches
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gen3-ai-random-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 535a5ec088c1ae1bf4d91dd3e35a56f64cf46d91
          path: .contract-reference/gen1
      - name: Install runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check native random branches
        run: luajit tests/engine/gen3_ai_random.lua
      - name: Compare actual native AI interpreters
        run: |
          mkdir -p /tmp/gen3-ai-random
          python3 tools/gen3-ai-random-contract-check/check.py --gen1 .contract-reference/gen1 --report /tmp/gen3-ai-random/records.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gen3-ai-random
          path: /tmp/gen3-ai-random
          if-no-files-found: ignore
