name: portable script-text sources
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: text-source-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 535a5ec088c1ae1bf4d91dd3e35a56f64cf46d91
          path: .contract-reference/gen1
      - name: Install runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check native readers and ownership
        run: |
          luajit tests/engine/text_sources.lua
          luajit tests/engine/text_source_authority.lua
      - name: Compare unchanged public consumer through both SDKs
        run: |
          mkdir -p /tmp/text-source-contract
          python3 tools/text-source-contract-check/check.py --gen1 .contract-reference/gen1 --report /tmp/text-source-contract/api3.json
          python3 tools/text-source-contract-check/check.py --gen1 .contract-reference/gen1 --host-api 2 --report /tmp/text-source-contract/host-api2-unified.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: text-source-contract
          path: /tmp/text-source-contract
          if-no-files-found: ignore
