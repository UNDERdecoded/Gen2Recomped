name: native critical/type ordering
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: critical-order-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 535a5ec088c1ae1bf4d91dd3e35a56f64cf46d91
          path: .contract-reference/gen1
      - name: Install runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check critical/type boundaries
        run: |
          luajit tests/engine/gen3_critical_order.lua
          luajit tests/engine/critical_order_contract.lua
      - name: Compare unchanged public consumer
        run: |
          mkdir -p /tmp/critical-order
          python3 tools/critical-order-contract-check/check.py --gen1 .contract-reference/gen1 --host-api 3 --report /tmp/critical-order/api3.json
          python3 tools/critical-order-contract-check/check.py --gen1 .contract-reference/gen1 --host-api 2 --report /tmp/critical-order/api2.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: critical-order
          path: /tmp/critical-order
          if-no-files-found: ignore
