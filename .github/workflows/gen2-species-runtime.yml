name: Native GSC runtime identities
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Native graph, old saves and script/breeding identities
        run: |
          luajit tests/engine/gen2_species_runtime.lua
          luajit tests/engine/gen2_species_gameplay.lua
