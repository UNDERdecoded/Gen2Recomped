name: Native GBA layout ownership
on:
  pull_request:
    paths:
      - '.github/workflows/gba-layout.yml'
      - 'src/**'
      - 'tests/gba_layout/**'
      - 'tests/engine/gen3_layout*.lua'
      - 'tools/gba-layout-check/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: gen2
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 535a5ec088c1ae1bf4d91dd3e35a56f64cf46d91
          path: gen1-reference
          sparse-checkout: |
            src
            data
            tests
            assets/fonts
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Actual native grid, restoration and ownership
        working-directory: gen2
        run: |
          luajit tests/engine/gen3_layout_cells.lua
          luajit tests/engine/gen3_layout_handles.lua
      - name: Identical consumer on pinned native engines
        run: python3 gen2/tools/gba-layout-check/check.py --gen1 gen1-reference --gen2 gen2 --report "${{ runner.temp }}/gba-layout.json"
      - uses: actions/upload-artifact@v7
        with:
          name: native-gba-layout-comparison
          path: ${{ runner.temp }}/gba-layout.json
          if-no-files-found: error
