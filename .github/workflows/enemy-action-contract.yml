name: Enemy move choice contracts
on:
  pull_request:
    paths:
      - '.github/workflows/enemy-action-contract.yml'
      - 'src/**'
      - 'examples/portable_enemy_action/**'
      - 'tests/enemy_actions/**'
      - 'tests/engine/portable_enemy_action_*.lua'
      - 'tests/engine/portable_enemy_move_records.lua'
      - 'tests/engine/portable_enemy_targets.lua'
      - 'tests/engine/gen3_follow_me.lua'
      - 'tools/enemy-action-contract-check/**'
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: enemy-action-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: gen2
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 535a5ec088c1ae1bf4d91dd3e35a56f64cf46d91
          path: gen1-reference
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Actual public hook and native move execution
        run: >-
          python3 gen2/tools/enemy-action-contract-check/check.py
          --gen1 gen1-reference --gen2 gen2
          --report "${{ runner.temp }}/enemy-action-report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: enemy-action-contract-report
          path: ${{ runner.temp }}/enemy-action-report.json
          if-no-files-found: error
