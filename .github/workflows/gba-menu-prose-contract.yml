name: portable GBA menu prose
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gba-menu-prose-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 535a5ec088c1ae1bf4d91dd3e35a56f64cf46d91
          path: .contract-reference/gen1
      - name: Install runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check native menu integration
        run: |
          luajit tests/engine/gba_menu_prose.lua
          luajit tests/engine/gba_menu_prose_native.lua
      - name: Compare native readers through both SDKs
        run: |
          mkdir -p /tmp/gba-menu-prose
          python3 tools/gba-menu-prose-contract-check/generate-facts.py --gen1 .contract-reference/gen1 --check
          python3 tools/gba-menu-prose-contract-check/check.py --gen1 .contract-reference/gen1 --report /tmp/gba-menu-prose/api3.json
          python3 tools/gba-menu-prose-contract-check/check.py --gen1 .contract-reference/gen1 --host-api 2 --report /tmp/gba-menu-prose/host2.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gba-menu-prose-contract
          path: /tmp/gba-menu-prose
          if-no-files-found: ignore
