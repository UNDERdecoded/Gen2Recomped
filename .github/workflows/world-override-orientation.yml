name: world override orientation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compositor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y luajit love xvfb
      - run: luajit tests/engine/world_override_orientation.lua
      - run: luajit tests/engine/legacy_shader_compat.lua
      - run: xvfb-run -a love tools/legacy-shader-check
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
