name: ordinary GBA base damage
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gba-damage-base-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 535a5ec088c1ae1bf4d91dd3e35a56f64cf46d91
          path: .contract-reference/gen1
      - name: Install runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check GBA damage and older-profile retention
        run: |
          luajit tests/engine/gba_damage_base.lua
          luajit tests/engine/gen3_held_damage.lua
          luajit tests/engine/gen3_held_damage_link.lua
      - name: Compare actual ordinary damage calculators
        run: |
          mkdir -p /tmp/gba-damage-base
          python3 tools/gba-damage-base-contract-check/check.py --gen1 .contract-reference/gen1 --report /tmp/gba-damage-base/records.json
          python3 tools/held-damage-contract-check/check.py --gen1 .contract-reference/gen1 --report /tmp/gba-damage-base/held-records.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gba-damage-base
          path: /tmp/gba-damage-base
          if-no-files-found: ignore
