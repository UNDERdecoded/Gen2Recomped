name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Fetch LÖVE sources + package game.love
        run: |
          scripts/build_ios.sh --fetch --package-only

      - name: Build unsigned archive
        run: |
          set -euo pipefail

          cd mobile/ios/love-src/platform/xcode

          xcodebuild archive \
            -project love.xcodeproj \
            -scheme love-ios \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/Gen2Recomped.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          mkdir -p Payload
          cp -R build/Gen2Recomped.xcarchive/Products/Applications/*.app Payload/
          zip -r gen2recomp-unsigned.ipa Payload
          rm -rf Payload

          echo "Created: gen2recomp-unsigned.ipa"
          ls -lh gen2recomp-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: gen2recomp-unsigned-ipa
          path: gen2recomp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
