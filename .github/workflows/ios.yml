name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned iOS (via project script)
        run: |
          # Fetch LÖVE sources + dependencies, then build without signing
          scripts/build_ios.sh --fetch --release --device --ipa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: gen2recomp-unsigned-ipa
          path: dist/ios/*.ipa
          if-no-files-found: error
          retention-days: 14
