name: R36S Build

on:
  push:
    branches: [ "main", "dev" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

concurrency:
  group: r36s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-r36s:
    name: Build R36S Port
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Executability
        run: |
          chmod +x build-r36s.sh
          chmod +x scripts/*.sh 2>/dev/null || true

      - name: Execute R36S Build Script
        run: bash build-r36s.sh

      - name: Upload R36S Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gen2Recomped-r36s
          path: dist/r36s/Gen2Recomped-r36s.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Artifact and Update Release Changelog
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          # 1. Resolve current active release tag
          LATEST_TAG=$(gh release view --json tagName --jq '.tagName')
          echo "Targeting release: $LATEST_TAG"
          
          # 2. Upload the new R36S asset (clobbers existing zip if pipeline is re-run)
          gh release upload "$LATEST_TAG" dist/r36s/Gen2Recomped-r36s.zip --clobber
          
          # 3. Pull existing release notes so we do not overwrite them
          gh release view "$LATEST_TAG" --json body --jq '.body' > release_notes.md
          
          # 4. Append the R36S changelog data
          echo -e "\n## R36S Build Update" >> release_notes.md
          echo "* **Added:** Build pipeline and deployment archive for the R36S (\`Gen2Recomped-r36s.zip\`)." >> release_notes.md
          
          # 5. Dynamically append upstream merges
          # This queries the last 5 merge commits to document upstream syncs automatically
          echo -e "\n### Upstream Syncs & Merges" >> release_notes.md
          git log --merges --pretty=format:"* %h - %s" -n 5 >> release_notes.md
          
          # 6. Push the updated notes back to the active GitHub Release
          gh release edit "$LATEST_TAG" --notes-file release_notes.md