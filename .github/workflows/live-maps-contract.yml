name: portable live-map lifecycle contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-maps-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 79ea62f45fb2ea8f65d081a109431e4eb1bbdb36
          path: .contract-reference/gen1
      - name: Install ROM-free test runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check native lifecycle, pixel reader and legacy readers
        run: |
          luajit tests/engine/live_maps_lifecycle.lua
          luajit tests/engine/api3_compat.lua
          luajit tests/engine/world_read_api.lua
      - name: Compare both engines in every SDK mode
        run: |
          mkdir -p /tmp/live-maps-contract
          python3 tools/live-maps-contract-check/check.py --gen1 .contract-reference/gen1 \
            --api 1 --format native --report /tmp/live-maps-contract/api1-native.json
          python3 tools/live-maps-contract-check/check.py --gen1 .contract-reference/gen1 \
            --api 2 --format native --report /tmp/live-maps-contract/api2-native.json
          python3 tools/live-maps-contract-check/check.py --gen1 .contract-reference/gen1 \
            --api 2 --format unified --report /tmp/live-maps-contract/api2-unified.json
          python3 tools/live-maps-contract-check/check.py --gen1 .contract-reference/gen1 \
            --api 3 --format unified --report /tmp/live-maps-contract/api3.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-maps-contract
          path: /tmp/live-maps-contract
          if-no-files-found: ignore
