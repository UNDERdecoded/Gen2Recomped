name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (e.g. 0.7.5)"
        required: true
        default: "0.7.5"
      device:
        description: "Build for device (IPA). Needs signing secrets."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15   # or macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: |
          brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      # Optional but required for a real device IPA
      - name: Import signing certificate
        if: ${{ inputs.device }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "::error::Missing secret IOS_BUILD_CERTIFICATE_BASE64"
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          echo "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM" >> "$GITHUB_ENV"
          echo "Identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build iOS
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          GEN1_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          ARGS=(--fetch --release --version "${{ inputs.version }}")
          if [ "${{ inputs.device }}" = "true" ]; then
            ARGS+=(--device --ipa)
          fi
          scripts/build_ios.sh "${ARGS[@]}"

      - name: Upload IPA / app
        uses: actions/upload-artifact@v4
        with:
          name: gen2recomp-ios-${{ inputs.version }}
          path: |
            dist/ios/*.ipa
            dist/ios/**/*.app
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup keychain
        if: always() && inputs.device
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true