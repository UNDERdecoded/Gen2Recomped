name: native trainer AI metadata
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trainer-ai-metadata-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 535a5ec088c1ae1bf4d91dd3e35a56f64cf46d91
          path: .contract-reference/gen1
      - name: Install runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check native metadata extraction
        run: luajit tests/engine/trainer_ai_metadata.lua
      - name: Compare actual native importer records
        run: |
          mkdir -p /tmp/trainer-ai-metadata
          python3 tools/trainer-ai-metadata-contract-check/check.py --gen1 .contract-reference/gen1 --report /tmp/trainer-ai-metadata/records.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trainer-ai-metadata
          path: /tmp/trainer-ai-metadata
          if-no-files-found: ignore
