name: portable core.logic_speed contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: logic-speed-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 79ea62f45fb2ea8f65d081a109431e4eb1bbdb36
          path: .contract-reference/gen1
      - name: Install ROM-free test runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check native speed dispatch, ownership and clocks
        run: |
          luajit tests/engine/logic_speed.lua
          luajit tests/engine/logic_speed_routing.lua
          luajit tests/engine/logic_speed_clock.lua
      - name: Compare native API 1 and 2
        run: |
          mkdir -p /tmp/logic-speed-contract
          python3 tools/logic-speed-contract-check/check.py --gen1 .contract-reference/gen1 \
            --api 1 --report /tmp/logic-speed-contract/api1-native.json
          python3 tools/logic-speed-contract-check/check.py --gen1 .contract-reference/gen1 \
            --report /tmp/logic-speed-contract/api2-native.json
      - name: Compare unified callbacks and API 3
        run: |
          python3 tools/logic-speed-contract-check/check.py --gen1 .contract-reference/gen1 \
            --format unified --report /tmp/logic-speed-contract/api2-unified.json
          python3 tools/logic-speed-contract-check/check.py --gen1 .contract-reference/gen1 \
            --api 3 --format unified --report /tmp/logic-speed-contract/api3.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logic-speed-contract
          path: /tmp/logic-speed-contract
          if-no-files-found: ignore
